<!DOCTYPE html>
<html>
<head>
    <title>Responsive Iframe</title>

    <style>
        .iframe-box {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        .iframe-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h2>Responsive Iframe</h2>

    <div class="iframe-box">
        <iframe
            src="https://www.example.com"
            title="Example Website">
        </iframe>
    </div>

</body>
</html>
