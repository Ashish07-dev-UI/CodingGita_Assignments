<!DOCTYPE html>
<html>
<head>
    <title>Styled Iframe</title>

    <style>
        iframe {
            width: 100%;
            height: 420px;
            border: none;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
    </style>
</head>
<body>

    <h2>Styled Iframe</h2>

    <iframe
        src="https://www.example.com"
        title="Example Website"
        allow="gyroscope">
    </iframe>

</body>
</html>
