<!DOCTYPE html>
<html>
<head>
    <title>Two Iframes</title>
</head>
<body>

    <h2>Side by Side Iframes</h2>

    <iframe
        src="https://www.example.com"
        width="48%"
        height="350"
        title="Fullscreen Iframe"
        allow="fullscreen">
    </iframe>

    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="48%"
        height="350"
        title="Gyroscope Iframe"
        allow="gyroscope">
    </iframe>

</body>
</html>
