<!DOCTYPE html>
<html>
<head>
    <title>Three Iframes</title>
</head>
<body>

    <h2>Different Iframes</h2>

    <iframe
        src="https://www.example.com"
        width="100%"
        height="250"
        title="Example Website - Fullscreen"
        allow="fullscreen">
    </iframe>

    <br><br>

    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="700"
        height="350"
        title="Video - Gyroscope"
        allow="gyroscope">
    </iframe>

    <br><br>

    <iframe
        src="https://device.example.com"
        width="500"
        height="300"
        title="USB Device Page"
        allow="usb">
    </iframe>

</body>
</html>
