<!DOCTYPE html>
<html>
<head>
    <title>Modern Iframe Card</title>

    <style>
        .card {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            background-color: white;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <iframe
            src="https://www.example.com"
            title="Example Website"
            allow="gyroscope">
        </iframe>
    </div>

</body>
</html>
