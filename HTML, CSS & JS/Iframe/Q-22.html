<!DOCTYPE html>
<html>
<head>
    <title>Iframe with Fullscreen and USB</title>
</head>
<body>

    <h2>Fullscreen and USB Iframe</h2>

    <iframe
        src="https://device.example.com"
        width="700"
        height="450"
        title="USB Device Viewer"
        allow="fullscreen; usb"
        frameborder="0">
    </iframe>

</body>
</html>
