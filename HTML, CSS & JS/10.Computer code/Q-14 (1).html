<!DOCTYPE html>
<html>
<head>
    <title>Styled Elements</title>

    <style>
        kbd{
            background:#f2f2f2;
            border:1px solid gray;
            padding:5px;
            border-radius:4px;
            font-family:monospace;
        }

        pre{
            background:#1e1e1e;
            color:white;
            padding:15px;
            border-radius:8px;
        }
    </style>
</head>
<body>

    <p>Press <kbd>Ctrl + P</kbd> to print.</p>

<pre>
print("Hello World")
</pre>

</body>
</html>
