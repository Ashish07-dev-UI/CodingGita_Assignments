<!DOCTYPE html>
<html>
<head>
    <title>Styled Keyboard</title>

    <style>
        kbd{
            background:#f2f2f2;
            border:1px solid gray;
            padding:4px 8px;
            border-radius:5px;
            font-family:monospace;
        }
    </style>
</head>
<body>

    <p>Press <kbd>Enter</kbd> to continue.</p>

</body>
</html>
