<!DOCTYPE html>
<html>
<head>
    <title>Formaction Override</title>
</head>
<body>

<form action="/submit.php" method="post">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name">

    <br><br>

    <input type="submit" value="Submit">

    <input type="submit"
           value="Submit to Admin"
           formaction="/admin.php">

</form>

</body>
</html>
