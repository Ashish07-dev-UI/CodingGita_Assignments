<!DOCTYPE html>
<html>
<head>
    <title>Form Attribute</title>
</head>
<body>

<form id="studentForm" action="/submit.php" method="post">

    <input type="submit" value="Submit">

</form>

<br>

<label for="name">Student Name:</label>

<input type="text"
       id="name"
       name="name"
       form="studentForm">

</body>
</html>
