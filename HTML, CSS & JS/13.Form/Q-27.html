<!DOCTYPE html>
<html>
<head>
    <title>Telephone Input</title>
</head>
<body>

<form>

    <label for="phone">Phone Number:</label>

    <input type="tel"
           id="phone"
           name="phone"
           pattern="[0-9]{10}"
           placeholder="Enter 10-digit phone number">

</form>

</body>
</html>
