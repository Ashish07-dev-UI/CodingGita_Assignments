<!DOCTYPE html>
<html>
<head>
    <title>Reserved Characters</title>
</head>
<body>

<p>Use &lt; to open an HTML tag.</p>
<p>Use &gt; to close an HTML tag.</p>
<p>Use &amp; to display the ampersand symbol.</p>

<p>Hexadecimal: &#x3C; represents less than.</p>
<p>Hexadecimal: &#x3E; represents greater than.</p>
<p>Hexadecimal: &#x26; represents ampersand.</p>

</body>
</html>
