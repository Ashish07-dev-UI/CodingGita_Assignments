<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #584d4d;
            font-family: Arial, sans-serif;
            gap: 30px;
        }

        .sudoku-board {
            border: 3px solid #000;
            background-color: #fff;
            display: flex;
            flex-direction: column;
        }

        .row {
            display: flex;
        }

        .cell {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #000;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
        }

        .green {
            background-color: rgb(30, 160, 132);
        }

        .cell:nth-child(3),
        .cell:nth-child(6) {
            border-right: 3px solid #000;
        }

        .row:nth-child(3),
        .row:nth-child(6) {
            border-bottom: 3px solid #000;
        }

        .cell:last-child {
            border-right: none;
        }

        .row:last-child .cell {
            border-bottom: none;
        }
    </style>
</head>
