<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        html {
            background-color: black;
        }
        .container {
            background-color: rgb(44, 37, 37);

            padding: 10px;
            margin: auto;

            border-radius: 10px;

            width: 430px;
            height: 670px;

            color: aliceblue;

            font-size: 26px;
            font-weight: 700;
            font-family: Arial, Helvetica, sans-serif;
        }

        .display {
            text-align: right;
            font-size: 120px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .buttons {
            padding: 0px 20px;
        }

        .row1,
        .row2,
        .row3,
        .row4 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* padding: 10px; */
            margin-bottom: 15px;
        }

        .row5 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* padding: 10px; */
            margin-bottom: 15px;
        }

        .num {
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: grey;

            width: 88px;
            height: 88px;

            border-radius: 50%;
            /* padding: 10px; */
        }

        .fn {
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: lightgrey;
            color: black;

            width: 88px;
            height: 88px;

            border-radius: 50%;
            /* padding: 10px; */
        }

        .opr {
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: orange;
            border-radius: 50%;

            width: 88px;
            height: 88px;

            /* padding: 10px; */
        }

        .num-zero {
            display: flex;
            /* justify-content: left; */
            align-items: center;

            padding-left: 30px;
            /* margin-right: 10px; */

            width: 160px;
            height: 88px;

            background-color: grey;
            border-radius: 170px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="display">7744</div>
        <div class="buttons">
            <div class="row1">
                <div class="fn">C</div>
                <div class="fn">+/-</div>
                <div class="fn">%</div>
                <div class="opr">&divide;</div>
            </div>
            <div class="row2">
                <div class="num">7</div>
                <div class="num">8</div>
                <div class="num">9</div>
                <div class="opr">x</div>
            </div>
            <div class="row3">
                <div class="num">4</div>
                <div class="num">5</div>
                <div class="num">6</div>
                <div class="opr">-</div>
            </div>
            <div class="row4">
                <div class="num">1</div>
                <div class="num">2</div>
                <div class="num">3</div>
                <div class="opr">+</div>
            </div>
            <div class="row5">
                <div class="num-zero">0</div>
                <div class="num">,</div>
                <div class="opr">=</div>
            </div>
        </div>
    </div>

</body>

</html>
