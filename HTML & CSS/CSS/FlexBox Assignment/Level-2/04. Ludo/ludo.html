<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .board {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;

            width: 752px;
            height: 752px;

            border: 1px solid black;
        }

        .top-left,.top-right {
            display: flex;
            flex-wrap: wrap;

            /* padding: 30px; */

            width: 300px;
            height: 300px;
        }

        .top-left {
            background-color: white;
            border: 50px solid red;
            
        }

        .top-right {
            background-color: white;
            border: 50px solid green;

        }

        .top-middle {
            width: 150px;
            height: 300px;
            background-color: white;
        }

        .top {
            display: flex;
            width: 150px;
            height: 300px;
        }

        .top .col1,.top .col2,.top .col3 {
            display: flex;
            flex-direction: column;
            width: 50px;
            height: 300px;
        }

        .top .box {
            width: 50px;
            height: 50px;
            /* flex-shrink: 0; */
            border: 1px solid black;
        }

        .middle {
            display: flex;
            width: 750px;
            height: 150px;
        }

        .left,.right {
            width: 300px;
            height: 150px;
            background-color: white;
        }

        .left .box, .right .box {
            display: flex;
            flex-wrap: wrap;;

            width: 50px;
            height: 50px;

            border: 1px solid black;
        }

        .row1, .row2, .row3 {
            display: flex;
        }

        .main-box {
            display: flex;
            flex-wrap: wrap;
            width: 150px;
            height: 150px;
            /* position: relative; */
        }

        .mb1,.mb2,.mb3,.mb4 {
            width: 150px;
            height: 150px;
            position: absolute;
            left: 309px;
            top: 309px;
        }

        .mb1 {
            background-color: red;
        }

        .mb2 {
            background-color: green;
            clip-path: polygon(0 0, 100% 0, 50% 50%);
        }

        .mb3 {
            background-color: blue;
            clip-path: polygon(0 100%, 100% 100%, 50% 50%);
        }

        .mb4 {
            background-color: yellow;
            clip-path: polygon(100% 0, 100% 100%, 50% 50%);
        }

        .bottom {
            display: flex;
            width: 750px;
            height: 300px;
        }

        .blue-box,.yellow-box {
            width: 300px;
            height: 300px;
        }

        .blue-box {
            background-color: white;
            border: 50px solid blue;
        }

        .yellow-box {
            background-color: white;
            border: 50px solid yellow;
        }

        .bottom-mid {
            display: flex;
            width: 150px;
            height: 300px;
            background-color: white;
        }

        .bottom-mid .col1,.bottom-mid .col2,.bottom-mid .col3 {
            display: flex;
            flex-direction: column;
            width: 50px;
            height: 300px;
        }

        .bottom-mid .box {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            border: 1px solid black;
        }

        .box-g, .box-y, .box-b, .box-r {
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
        }

        .box-g {
            width: 50px;
            height: 50px;
            background-color: green;
            border: 1px solid black;
        }

        .box-r {
            width: 50px;
            height: 50px;

            background-color: red;
            border: 1px solid black;
        }

        .box-b {
            width: 50px;
            height: 50px;
            background-color: blue;
            border: 1px solid black;
        }

        .box-y {
            width: 50px;
            height: 50px;
            background-color: yellow;
            border: 1px solid black;
        }

        .red-box .coin {
            height: 51px;
            width: 51px;

            border: 6px solid red;
            border-radius: 50%;
        }

        .coin-r1, .coin-r2 {
            display: flex;
        }

        .coin-r1 {
            margin-left: 24px;
            margin-top: 20px;
            gap: 50px;
        }

        .coin-r2 {
            margin-left: 24px;
            margin-top: 60px;
            gap: 50px;
        }

        .green-box .coin {
            height: 51px;
            width: 51px;

            border: 6px solid green;
            border-radius: 50%;
        }

        .coin-g1, .coin-g2 {
            display: flex;
        }

        .coin-g1 {
            margin-left: 24px;
            margin-top: 20px;
            gap: 50px;
        }

        .coin-g2 {
            margin-left: 24px;
            margin-top: 60px;
            gap: 50px;
        }

        .blue-box .coin {
            height: 51px;
            width: 51px;

            border: 6px solid blue;
            border-radius: 50%;
        }

        .coin-b1, .coin-b2 {
            display: flex;
        }

        .coin-b1 {
            margin-left: 24px;
            margin-top: 20px;
            gap: 50px;
        }

        .coin-b2 {
            margin-left: 24px;
            margin-top: 60px;
            gap: 50px;
        }

        .yellow-box .coin {
            height: 51px;
            width: 51px;

            border: 6px solid yellow;
            border-radius: 50%;
        }

        .coin-y1, .coin-y2 {
            display: flex;
        }

        .coin-y1 {
            margin-left: 24px;
            margin-top: 20px;
            gap: 50px;
        }

        .coin-y2 {
            margin-left: 24px;
            margin-top: 60px;
            gap: 50px;
        }

        

    </style>
</head>

<body>
    <div class="board">

        <div class="top-left">
            <div class="red-box">
                <div class="coin-r1">
                    <div class="coin"></div>
                    <div class="coin"></div>
                </div>
                <div class="coin-r2">
                    <div class="coin"></div>
                    <div class="coin"></div>
                </div>
            </div>
        </div>

        <div class="top-middle">
            <div class="top">
                <div class="col1">
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box-g">★</div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                </div>
                <div class="col2">
                    <div class="box"></div>
                    <div class="box-g"></div>
                    <div class="box-g"></div>
                    <div class="box-g"></div>
                    <div class="box-g"></div>
                    <div class="box-g"></div>
                </div>
                <div class="col3">
                    <div class="box"></div>
                    <div class="box-g">★</div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                </div>
            </div>
        </div>

        <div class="top-right">
            <div class="green-box">
                <div class="coin-g1">
                    <div class="coin"></div>
                    <div class="coin"></div>
                </div>
                <div class="coin-g2">
                    <div class="coin"></div>
                    <div class="coin"></div>
                </div>
            </div>
        </div>

        <div class="middle">
            <div class="left">
                <div class="row1">
                    <div class="box"></div>
                    <div class="box-r">★ </div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                </div>
                <div class="row2">
                    <div class="box"></div>
                    <div class="box-r"></div>
                    <div class="box-r"></div>
                    <div class="box-r"></div>
                    <div class="box-r"></div>
                    <div class="box-r"></div>
                </div>
                <div class="row3">
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box-r">★ </div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                </div>
            </div>

            <div class="main-box">
                <div class="mb1"></div>
                <div class="mb2"></div>
                <div class="mb3"></div>
                <div class="mb4"></div>
            </div>

            <div class="right">
                <div class="row1">
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box-y">★ </div>
                    <div class="box"></div>
                    <div class="box"></div>
                </div>
                <div class="row2">
                    <div class="box-y"></div>
                    <div class="box-y"></div>
                    <div class="box-y"></div>
                    <div class="box-y"></div>
                    <div class="box-y"></div>
                    <div class="box"></div>
                </div>
                <div class="row3">
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box-y">★ </div>
                    <div class="box"></div>
                </div>
            </div>
        </div>

        <div class="bottom">
            <div class="blue-box">
                <div class="coin-b1">
                    <div class="coin"></div>
                    <div class="coin"></div>
                </div>
                <div class="coin-b2">
                    <div class="coin"></div>
                    <div class="coin"></div>
                </div>
            </div>

            <div class="bottom-mid">
                <div class="col1">
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box-b">★ </div>
                    <div class="box"></div>
                </div>
                <div class="col2">
                    <div class="box-b"></div>
                    <div class="box-b"></div>
                    <div class="box-b"></div>
                    <div class="box-b"></div>
                    <div class="box-b"></div>
                    <div class="box"></div>
                </div>
                <div class="col3">
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box"></div>
                    <div class="box-b">★</div>
                    <div class="box"></div>
                    <div class="box"></div>
                </div>
            </div>

            <div class="yellow-box">
                <div class="coin-y1">
                    <div class="coin"></div>
                    <div class="coin"></div>
                </div>
                <div class="coin-y2">
                    <div class="coin"></div>
                    <div class="coin"></div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
