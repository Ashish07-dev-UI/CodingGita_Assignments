<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            /* background-color: black; */
            font-family: Arial, Helvetica, sans-serif;
            color: aliceblue;
        }

        .container {
            margin: auto;
            margin-top: 5px;
            width: 1480px;
            height: 700px;
            background-color: #081728;
        }

        .logo {
            text-align: center;
            font-size: large;
            font-weight: 700;
            font-size: 30px;
            margin-bottom: 80px;
            padding-top: 30px;
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 160px;
        }

        .india {
            width: 300px;
            height: 280px;

            border-radius: 20px;

            background-color: #125299;
        }

        .pakistan {
            width: 300px;
            height: 280px;

            border-radius: 20px;

            background-color: #3d9435;
        }

        .display {
            text-align: center;
            padding: 40px;
            margin-top: 5px;
            font-size: 55px;
            font-weight: 600;
        }

        .num {
            display: flex;
            justify-content: space-between;
            padding: 0px 40px;
            /* margin: 0px, 40px; */
            font-size: 18px;
            color: black;
            font-weight: 900;
        }

        .bottom-num {
            text-align: center;
            margin-top: 20px;
            font-size: 35px;
            font-weight: 800;
        }

        .circle {
            display: flex;
            justify-content: center;
            align-items: center;

            /* margin: 0px 10px; */

            width: 30px;
            height: 30px;

            border-radius: 50px;
            background-color: white;
            color: black;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-top: 80px;
        }

        .edit {
            height: 100px;
            width: 100px;

            background-color: orange;
            border: 4px solid white;
            border-bottom: 10px solid white;

            border-radius: 25px;
            font-size: 50px;
        }

        .reset {
            height: 100px;
            width: 100px;

            background-color: red;
            border: 4px solid white;
            border-bottom: 10px solid white;

            border-radius: 25px;
            font-size: 50px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">SUPER <br> OVER</div>
        <div class="scoreboard">
            <div class="india">
                <div class="display">IND</div>
                <div class="num">
                    <div class="circle">4</div>
                    <div class="circle">3</div>
                    <div class="circle">2</div>
                    <div class="circle">6</div>
                    <div class="circle">6</div>
                    <div class="circle">6</div>
                </div>
                <div class="bottom-num">27/0</div>
            </div>
            <div class="pakistan">
                <div class="display">PAK</div>
                <div class="num">
                    <div class="circle">2</div>
                    <div class="circle">4</div>
                    <div class="circle">0</div>
                    <div class="circle">3</div>
                    <div class="circle">1</div>
                    <div class="circle">4</div>
                </div>
                <div class="bottom-num">14/0</div>
            </div>
        </div>

        <div class="controls">
            <button class="edit">🏏</button>
            <button class="reset">⟲</button>
        </div>
    </div>

</body>

</html>
