<!DOCTYPE html>
<html>
<head>
    <title>Multiple Permissions Iframe</title>
</head>
<body>

    <h2>Iframe with Multiple Permissions</h2>

    <iframe
        src="https://www.example.com"
        width="800"
        height="400"
        title="Example Website"
        allow="fullscreen; gyroscope; usb">
    </iframe>

</body>
</html>
