<!DOCTYPE html>
<html>
<head>
    <title>Responsive Iframe</title>

    <style>
        .responsive-iframe {
            width: 100%;
            height: 400px;
            border: none;
            margin: 10px;
        }
    </style>
</head>
<body>

    <h2>Responsive Iframe</h2>

    <iframe
        src="https://www.example.com"
        class="responsive-iframe"
        title="Example Website">
    </iframe>

</body>
</html>
