<!DOCTYPE html>
<html>
<head>
    <title>Links with Named Iframe</title>
</head>
<body>

    <h2>Website Links</h2>

    <ul>
        <li><a href="https://www.example.com" target="myFrame">Example</a></li>
        <li><a href="https://www.wikipedia.org" target="myFrame">Wikipedia</a></li>
        <li><a href="https://www.w3schools.com" target="myFrame">W3Schools</a></li>
    </ul>

    <iframe
        name="myFrame"
        width="100%"
        height="400"
        title="Website Viewer"
        allow="fullscreen">
    </iframe>

</body>
</html>
