<!DOCTYPE html>
<html>
<head>
    <title>Iframe Permission Comparison</title>
</head>
<body>

    <h2>Iframe Comparison</h2>

    <iframe
        src="https://www.example.com"
        width="100%"
        height="300"
        title="Iframe with Fullscreen Permission"
        allow="fullscreen">
    </iframe>

    <br><br>

    <iframe
        src="https://www.example.com"
        width="100%"
        height="300"
        title="Iframe without Allow Attribute">
    </iframe>

</body>
</html>
