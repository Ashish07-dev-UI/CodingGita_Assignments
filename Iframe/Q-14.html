<!DOCTYPE html>
<html>
<head>
    <title>Multiple Iframes</title>
</head>
<body>

    <h2>Iframe Example</h2>

    <p>
        This page shows two iframes with different permissions.
    </p>

    <iframe
        src="https://device.example.com"
        width="500"
        height="300"
        title="USB Device Page"
        allow="usb">
    </iframe>

    <br><br>

    <iframe
        src="https://www.example.com"
        width="700"
        height="400"
        title="Example Website"
        allow="fullscreen">
    </iframe>

</body>
</html>
